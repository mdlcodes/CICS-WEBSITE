<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UST CICS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <header>
            <nav>
                <div id="brand-container">
                    <a href="#"><img src="images/cics-logo.png" alt="UST CICS LOGO" id="brand-logo"></a>
                    <div id="brand-text">
                        <span id="brand-subtext">UNIVERSITY OF SANTO TOMAS</span>
                        <span id="brand-maintext">College of Information and Computing Sciences</span>
                    </div>
                </div>
                
                <!--Hamburger button for mobile-->
                <input type="checkbox" id="menu">
                <label for="menu" id="hamburger-icon">
                    <img src="images/icons/menu-icon.svg" alt="hamburger icon" id="menu-open">
                    <img src="images/icons/close-icon.svg" alt="close icon" id="menu-close">
                </label>

                <div id="nav-links-container">
                    <a href="index.html" class="nav-links">Home</a>
                    <a href="program.html" class="nav-links">Program</a>
                    <a href="community.html" class="nav-links active">Community</a>
                    <button class="btn-primary nav">ENROLL NOW</button>
                </div>
            </nav>
    </header>


    <main>
         <section id="hero-section">
            <div id="hero-content">
                <h1 id="h1-hero">The Community</h1>
                <p id="p-hero">Discover a vibrant community of Thomasians united by a shared passion for technology, learning, innovation, and collaboration.</p>
                <button class="btn-primary hero-btn">LEARN MORE</button>
            </div>
        </section>

         <!--===========-================================-->
        <!--=========== COLLEGE LEADERSHIP SECTION==============-->\

        <section id="leadership-section">
            <div class="section-title about">
               <h3>College Leadership</h3>            
                <hr>
            </div>

            <ul class="leadership-list">
                <li>
                    <div class="leader-card">
                        <figure>
                            <img src="images/dept/ladao.jpg" alt="Asst. Prof. Christopher D. Ladao,MSCS Photo" class="leader-img">
                            <figcaption>
                                <h6>Asst. Prof. Christopher D. Ladao, MSCS</h6>
                                <p>Dean</p>
                            </figcaption>
                        </figure>
                    </div>
                </li>

                <li>
                    <div class="leader-card">
                        <figure>
                            <img src="images/dept/sigaya.jpg" alt="Rev. Fr. Gaspar Sigaya, O.P. Photo" class="leader-img">
                            <figcaption>
                                <h6>Rev. Fr. Gaspar Sigaya, O.P.</h6>
                                <p>Regent</p>
                            </figcaption>
                        </figure>
                    </div>
                </li>


                 <li>
                    <div class="leader-card">
                        <figure>
                            <img src="images/dept/cosme.jpg" alt="Assoc. Prof. Perla P. Cosme, MSCS Photo" class="leader-img">
                            <figcaption>
                                <h6>Assoc. Prof. Perla P. Cosme, MSCS</h6>
                                <p>Assistant Dean</p>
                            </figcaption>
                        </figure>
                    </div>
                </li>

                <li>
                    <div class="leader-card">
                        <figure>
                            <img src="images/dept/tucay.jpg" alt="Inst. Edmund D. Tucay, MSCSPhoto" class="leader-img">
                            <figcaption>
                                <h6>Assoc. Prof. Perla P. Cosme, MSCS</h6>
                                <p>College Secretary</p>
                            </figcaption>
                        </figure>
                    </div>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
